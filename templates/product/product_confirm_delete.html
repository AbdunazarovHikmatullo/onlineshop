{% extends 'base.html' %}

{% block title %}Удалить товар — VMARKET{% endblock %}

{% block content %}
<div class="container" style="padding:64px 0;max-width:520px;">
  <div style="border:1px solid #fca5a5;border-radius:8px;padding:36px;background:#fff;">
    <h1 style="font-size:1.3rem;font-weight:800;margin-bottom:10px;">Удалить товар?</h1>
    <p style="color:#717171;font-size:.9rem;margin-bottom:6px;">
      Это действие необратимо. Будет удалён товар:
    </p>
    <p style="font-weight:600;margin-bottom:28px;">{{ product.name }} (арт. {{ product.sku }})</p>
    <form method="post" style="display:flex;gap:10px;">
      {% csrf_token %}
      <button type="submit" class="btn btn-accent" style="background:#dc2626;padding:10px 20px;">
        Да, удалить
      </button>
      <a href="{% url 'product:detail' product.slug %}" class="btn btn-outline" style="padding:10px 20px;">
        Отмена
      </a>
    </form>
  </div>
</div>
{% endblock %}
