{% extends 'base.html' %}

{% block title %}Заявка принята — VMARKET{% endblock %}

{% block content %}
<div class="container" style="padding:80px 0;max-width:560px;text-align:center;">
  <div style="width:64px;height:64px;border-radius:50%;background:#e8f5e9;display:grid;place-items:center;margin:0 auto 24px;color:#22c55e;">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <h1 style="font-size:1.6rem;font-weight:800;margin-bottom:10px;">Заявка принята!</h1>
  <p style="color:#717171;font-size:.95rem;line-height:1.65;margin-bottom:32px;">
    Мы получили вашу заявку и скоро с вами свяжемся.<br>
    Менеджер перезвонит по указанному номеру телефона.
  </p>
  <div style="display:flex;gap:12px;justify-content:center;">
    <a href="{% url 'product:catalog' %}" class="btn btn-accent" style="padding:11px 24px;">Продолжить покупки</a>
    <a href="{% url 'product:index' %}" class="btn btn-outline" style="padding:11px 24px;">На главную</a>
  </div>
</div>
{% endblock %}
